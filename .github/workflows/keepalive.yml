name: Supabase keep-alive

# Supabase pauses free-tier projects after ~7 days with no activity. This hits
# the REST API on a schedule so the database is reached often enough to stay
# awake. The request runs with the public anon key and (with per-user RLS on)
# simply returns no rows — but it still reaches Postgres, which is what counts.
#
# One-time setup: add two repository secrets under
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   SUPABASE_URL        = your VITE_SUPABASE_URL value
#   SUPABASE_ANON_KEY   = your VITE_SUPABASE_ANON_KEY value
#
# Note: GitHub disables scheduled workflows after 60 days with no repo activity.
# Any commit (or a manual run below) resets that, so an active project is fine.

on:
  schedule:
    - cron: "17 9 */3 * *" # every 3 days (well inside the ~7-day idle window)
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/settings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $code"
          # Any reached-the-server response (2xx/4xx) keeps it awake.
          # Only a real outage (5xx) or no-connection (000) should fail the run.
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "Keep-alive ping failed"; exit 1
          fi
